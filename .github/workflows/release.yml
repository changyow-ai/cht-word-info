name: Release (signed IPA)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Marketing version (e.g. 0.1.0). Optional; defaults to project.yml value."
        required: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  archive:
    name: Archive & Export IPA
    runs-on: macos-15
    timeout-minutes: 45

    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
      PROVISIONING_PROFILE_NAME: ${{ secrets.PROVISIONING_PROFILE_NAME }}
      EXPORT_METHOD: ${{ secrets.EXPORT_METHOD }}        # development | ad-hoc | app-store

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sanity-check required secrets
        run: |
          missing=0
          for v in APPLE_TEAM_ID BUNDLE_ID PROVISIONING_PROFILE_NAME EXPORT_METHOD; do
            if [ -z "${!v}" ]; then
              echo "::error::Required secret '$v' is not set"
              missing=1
            fi
          done
          for v in BUILD_CERTIFICATE_BASE64 P12_PASSWORD BUILD_PROVISION_PROFILE_BASE64 KEYCHAIN_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::Required secret '$v' is not set"
              missing=1
            fi
          done
          [ "$missing" = "0" ]
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Decode signing assets
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/signing"
          # Use printf instead of echo to avoid trailing newline issues
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing/cert.p12"
          printf '%s' "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing/profile.mobileprovision"
          # Make sure decoding produced non-empty files (helps catch malformed secrets fast)
          test -s "$RUNNER_TEMP/signing/cert.p12"
          test -s "$RUNNER_TEMP/signing/profile.mobileprovision"

      - name: Create temporary keychain & import certificate
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          security import "$RUNNER_TEMP/signing/cert.p12" \
            -P "$P12_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | sed 's/[\" ]//g')
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KC" >/dev/null
          echo "BUILD_KEYCHAIN=$KC" >> "$GITHUB_ENV"

      - name: Install provisioning profile
        run: |
          set -euo pipefail
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          # Extract the profile UUID and use that as filename (Xcode's convention)
          UUID=$(security cms -D -i "$RUNNER_TEMP/signing/profile.mobileprovision" \
                 | plutil -extract UUID raw -o - -)
          cp "$RUNNER_TEMP/signing/profile.mobileprovision" "$PROFILE_DIR/$UUID.mobileprovision"
          echo "INSTALLED_PROFILE_PATH=$PROFILE_DIR/$UUID.mobileprovision" >> "$GITHUB_ENV"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Override marketing version (if provided)
        if: ${{ inputs.version != '' }}
        run: |
          echo "Setting MARKETING_VERSION to ${{ inputs.version }}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ inputs.version }}" App/Info.plist || true

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild \
            -project MiniMoeDict.xcodeproj \
            -scheme MiniMoeDict \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/MiniMoeDict.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$PROVISIONING_PROFILE_NAME" \
            archive

      - name: Render ExportOptions.plist from template
        run: |
          set -euo pipefail
          # Substitute env vars into the template (no secrets in repo).
          envsubst < ExportOptions.template.plist > "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Print" "$RUNNER_TEMP/ExportOptions.plist"

      - name: Export IPA
        run: |
          set -o pipefail
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/MiniMoeDict.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiniMoeDict-ipa
          path: ${{ runner.temp }}/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Attach IPA to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/ipa/*.ipa
          draft: true
          generate_release_notes: true

      - name: Cleanup signing assets (always)
        if: always()
        run: |
          set +e
          if [ -n "${BUILD_KEYCHAIN:-}" ]; then
            security delete-keychain "$BUILD_KEYCHAIN" || true
          fi
          if [ -n "${INSTALLED_PROFILE_PATH:-}" ]; then
            rm -f "$INSTALLED_PROFILE_PATH" || true
          fi
          rm -rf "$RUNNER_TEMP/signing" "$RUNNER_TEMP/ExportOptions.plist" || true
