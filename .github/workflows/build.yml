name: Build (unsigned)

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test (no signing)
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcrun --find swiftc
          swiftc --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (Debug, unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project MiniMoeDict.xcodeproj \
            -scheme MiniMoeDict \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Pick an available iOS Simulator
        id: pick_sim
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available --json | jq -r '
            [
              .devices
              | to_entries[]
              | select(.key | startswith("com.apple.CoreSimulator.SimRuntime.iOS-"))
              | { runtime: .key, devices: .value }
            ]
            | sort_by(.runtime) | reverse
            | map(.devices[]? | select(.isAvailable == true and (.name | startswith("iPhone"))))
            | .[0].udid // empty
          ')
          if [ -z "$UDID" ]; then
            echo "::error::No available iPhone simulator on this runner"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Selected simulator UDID: $UDID"
          echo "id=$UDID" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild \
            -project MiniMoeDict.xcodeproj \
            -scheme MiniMoeDict \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.pick_sim.outputs.id }}" \
            test
