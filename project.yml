name: MiniMoeDict

options:
  bundleIdPrefix: tw.example
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  defaultConfig: Release
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"        # iPhone + iPad
    DEVELOPMENT_TEAM: ""                  # Override on CLI / in Xcode signing pane
    CODE_SIGN_STYLE: Manual               # Manual signing for predictable CI
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO

targets:
  MiniMoeDict:
    type: application
    platform: iOS
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tw.example.minimoedict   # TODO: replace once user provides bundle id
        PRODUCT_NAME: MiniMoeDict
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "0.1.0"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO

  MiniMoeDictTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: MiniMoeDict
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tw.example.minimoedict.tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MiniMoeDict.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/MiniMoeDict"

schemes:
  MiniMoeDict:
    build:
      targets:
        MiniMoeDict: all
        MiniMoeDictTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MiniMoeDictTests
    archive:
      config: Release
